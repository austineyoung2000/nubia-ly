name: nubia-ly Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Policy tests
        run: |
          sh tests/run-policy-tests.sh
          python3 tests/test_clock_backend.py
          python3 tests/test_statusbar_backend.py
          python3 tests/test_surface_backend.py
          python3 tests/test_qs_appearance_backend.py
          python3 tests/test_qs_grid_inspection.py
          python3 tests/test_qs_grid_backend.py
          python3 tests/test_qs_layout_backend.py
          python3 tests/test_qs_outline_backend.py
          python3 tests/test_brightness_backend.py
          python3 tests/test_volume_backend.py
          python3 tests/test_notification_backend.py
          python3 tests/test_personalization_controls.py
          python3 tests/test_system_icon_packs.py
          python3 tests/test_battery_backend.py
          python3 tests/test_icon_controls_backend.py
          python3 tests/test_boot_resume_receiver.py
          python3 tests/test_guard_resume_service.py
          python3 tests/test_boot_animation_contract.py
          python3 tests/test_fingerprint_catalog.py
          python3 tests/test_fingerprint_backend.py
          python3 tests/test_sensor_fingerprint_backend.py
          python3 tests/test_sensor_runtime.py
          python3 tests/test_launcher_eligibility.py
          python3 tests/test_launcher_runtime.py
          python3 tests/test_launcher_folder_surface.py
          python3 tests/test_launcher_layout_mappings.py
          python3 tests/test_sensor_animation_backend.py
          python3 tests/test_animation_catalog.py
          python3 tests/test_fingerprint_broker.py
          python3 tests/test_fingerprint_service_client.py
          python3 tests/test_preview_sleep.py
          python3 tests/test_preview_recovery.py
          python3 tests/test_statusbar_preferences.py
          python3 tests/test_clock_date_backend.py
          python3 tests/test_inventory_client.py
          python3 tests/test_recovery_store.py
          python3 tests/test_root_guard.py
          python3 tests/test_guard_root_process.py
      - name: Recovery guard tests and ZIP
        run: |
          sudo python3 tests/test_guard_shell.py
          sudo python3 tests/test_unlock_resume_shell.py
          sudo python3 tests/test_boot_overlay_shell.py
          python3 scripts/package-guard.py
      - name: Prepare pinned boot-animation assets
        run: |
          python3 -m pip install Pillow==11.3.0
          python3 scripts/build-boot-assets.py
      - name: Prepare persistent signing
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -n "$KEYSTORE" ]; then
            [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] || {
              echo "Signing secrets incomplete; refusing ephemeral fallback."; exit 1;
            }
            umask 077
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/nubia-ly.jks"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          elif [ -n "$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo "Signing secrets incomplete; refusing ephemeral fallback."
            exit 1
          else
            echo "::warning::No signing secrets. This build uses an ephemeral debug key and cannot be relied on for updates."
          fi
      - name: Unit tests and test APK
        env:
          SIGNING_STORE_FILE: ${{ env.HAS_SIGNING == 'true' && format('{0}/nubia-ly.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "${HAS_SIGNING:-false}" = true ]; then
            gradle testDebugUnitTest assembleDebug assembleRelease
          else
            gradle testDebugUnitTest assembleDebug
          fi
      - name: Verify persistent signature
        if: env.HAS_SIGNING == 'true'
        run: |
          set -eu
          EXPECTED_CERT=$(cat docs/SIGNING_CERT_SHA256.txt)
          [ -n "$EXPECTED_CERT" ] || { echo "Expected public signing certificate is not configured."; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
          result=$($apksigner verify --print-certs "$apk")
          actual=$(printf '%s\n' "$result" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [ "$actual" = "$EXPECTED_CERT" ] || { echo "APK certificate mismatch."; exit 1; }
          done
          echo "Persistent test and release APK certificates verified."
      - name: Upload signed test APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nubia-ly-signed-test-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload signed release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nubia-ly-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Upload ephemeral test APK
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nubia-ly-ephemeral-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload guard module
        uses: actions/upload-artifact@v4
        with:
          name: nubia-ly-guard-test-module
          path: build/nubia-ly-guard-test.zip
      - name: Remove signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/nubia-ly.jks"
